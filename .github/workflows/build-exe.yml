name: Build Windows Installer (.EXE)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-installer:
    name: Build & Package Windows NSIS Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if (Test-Path package-lock.json) { Remove-Item package-lock.json -Force }
          npm install --legacy-peer-deps

      - name: Ensure Windows native build bindings
        run: npm install -D @rolldown/binding-win32-x64-msvc --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Install Electron and Electron Builder
        run: npm install -D electron electron-builder --legacy-peer-deps

      - name: Package installer with Electron Builder
        run: npx electron-builder --config electron-builder.json --win nsis --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexClean-Pro-Windows-Installer
          path: dist-electron/*.exe
          retention-days: 30
